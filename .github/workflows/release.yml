# Publica una versión al crear un tag vX.Y.Z:
#   git tag v0.5.0
#   git push origin v0.5.0
# Compila y prueba el host, firma el APK con la clave de NexScreen (secretos del repo), arma el
# instalador y crea el release con NexScreen-Setup-X.Y.Z.exe y NexScreen-X.Y.Z.apk. El texto del
# release sale de la sección de la versión en CHANGELOG.md (obligatoria).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Versión del tag
        id: version
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "El tag debe ser vX.Y.Z (recibido: ${{ github.ref_name }})" }
          "value=$version" >> $env:GITHUB_OUTPUT

      # Antes de compilar: si falta la sección en CHANGELOG.md, el release falla enseguida.
      - name: Notas del release
        shell: pwsh
        run: scripts\release-notes.ps1 -Version ${{ steps.version.outputs.value }} -OutFile "$env:RUNNER_TEMP\release-notes.md"

      - name: Tests del host
        run: dotnet test host -c Release

      - name: APK firmado
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.NEXSCREEN_KEYSTORE_BASE64 }}
          NEXSCREEN_KEYSTORE_PASSWORD: ${{ secrets.NEXSCREEN_KEYSTORE_PASSWORD }}
          NEXSCREEN_KEY_ALIAS: ${{ secrets.NEXSCREEN_KEY_ALIAS }}
        run: |
          if (-not $env:KEYSTORE_BASE64) { throw 'Faltan los secretos de firma del APK (NEXSCREEN_KEYSTORE_BASE64...)' }
          $keystore = Join-Path $env:RUNNER_TEMP 'nexscreen-release.jks'
          [IO.File]::WriteAllBytes($keystore, [Convert]::FromBase64String($env:KEYSTORE_BASE64))
          $env:NEXSCREEN_KEYSTORE = $keystore
          android\gradlew.bat -p android assembleRelease "-PversionName=${{ steps.version.outputs.value }}" --console=plain
          if ($LASTEXITCODE -ne 0) { throw 'Falló la compilación del APK' }
          Remove-Item $keystore

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Instalador
        shell: pwsh
        run: installer\build.ps1 -Apk android\app\build\outputs\apk\release\app-release.apk -Version ${{ steps.version.outputs.value }}

      - name: Publicar el release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.value }}'
          Copy-Item android\app\build\outputs\apk\release\app-release.apk "dist\NexScreen-$version.apk"
          gh release create '${{ github.ref_name }}' "dist\NexScreen-Setup-$version.exe" "dist\NexScreen-$version.apk" `
            --title "NexScreen $version" --notes-file "$env:RUNNER_TEMP\release-notes.md" --generate-notes
